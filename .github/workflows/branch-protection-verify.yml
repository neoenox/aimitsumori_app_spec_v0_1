name: Branch protection verification

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/branch-protection-verify.yml'
      - '.github/rulesets/main-required-checks.json'
      - 'tool/*applied_branch_protection.mjs'

permissions:
  contents: read

jobs:
  verify-applied-protection:
    name: Verify applied branch protection on main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test applied-state validator
        run: node --test tool/test_verify_applied_branch_protection.mjs
      - name: Verify effective branch rules and active rulesets
        env:
          BRANCH_PROTECTION_TOKEN: ${{ secrets.BRANCH_PROTECTION_TOKEN }}
        run: node tool/verify_applied_branch_protection.mjs "$GITHUB_REPOSITORY"
